<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Career Verse — Aarambh · Explore. Discover. Build your future. AI Career Navigation Ecosystem for Maharashtra.">
  <meta name="theme-color" content="#080a1e">
  <title>Career Verse — Aarambh · Explore. Discover. Build.</title>
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Google Fonts: Fraunces (Headings/Serif) + Manrope & Mukta (Body/Devanagari) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,560;9..144,650;9..144,780&family=Manrope:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/img/careerverse-logo.png">

  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* Global Mitra Slide-over Styles */
    .slideover-overlay {
      display: none;
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
      z-index: 400; backdrop-filter: blur(4px); transition: opacity 0.3s;
      opacity: 0;
    }
    .slideover-overlay.active {
      display: block;
      opacity: 1;
    }
    .mitra-slideover {
      position: fixed; top: 0; right: -400px; bottom: 0; width: 100%; max-width: 400px; 
      background: var(--bg); z-index: 500; transition: right 0.3s ease-in-out; 
      box-shadow: -10px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
    }
    .mitra-slideover.active {
      right: 0;
    }
    .chat-bubble { max-width: 85%; margin-bottom: 8px; }
    .bubble-tai { align-self: flex-start; }
    .bubble-user { align-self: flex-end; background: var(--gold-soft); padding: 10px; border-radius: 12px; border-top-right-radius: 0; }
  </style>
</head>
<body>
  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav mobile-only" aria-label="Mobile Bottom Navigation">
    <a href="/" class="bottom-nav-item" id="bnav-home">
      <span class="bnav-icon">🏠</span>
      <span class="bnav-label" data-i18n="nav_home">Home</span>
    </a>
    <a href="/cost-calculator" class="bottom-nav-item" id="bnav-kharcha">
      <span class="bnav-icon">💰</span>
      <span class="bnav-label" data-i18n="nav_kharcha">Kharcha</span>
    </a>
    <a href="/dashboard" class="bottom-nav-item" id="bnav-matches">
      <span class="bnav-icon">🎯</span>
      <span class="bnav-label" data-i18n="nav_dashboard">Matches</span>
    </a>
    <a href="/career-aunty" class="bottom-nav-item bottom-nav-tai" id="bnav-tai">
      <span class="bnav-icon">👩‍🏫</span>
      <span class="bnav-label" data-i18n="nav_mitra_tai">Mitra Tai</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="/static/js/mitra-page-guide.js"></script>
  <script src="/static/js/app.js"></script>

  <script>
    // Mobile menu toggle
    const burger = document.getElementById('burgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (burger && mobileMenu) {
      burger.addEventListener('click', () => {
        burger.classList.toggle('open');
        mobileMenu.classList.toggle('open');
        document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
      });
      mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
        burger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      }));
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
