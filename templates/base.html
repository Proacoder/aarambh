<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="CareerMitra - Multilingual career guidance for Maharashtra's rural students">
  <meta name="theme-color" content="#3D2B1F">
  <title>CareerMitra - करिअर मित्र</title>
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Fonts: Mukta (body, Devanagari) + Poppins (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  
  <!-- App CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav-bar" role="navigation" aria-label="Main navigation">
    <div class="container flex-between">
      <a href="/" class="nav-logo" data-i18n="app_name">CareerMitra</a>
      <div class="nav-right">
        <div class="lang-toggle" role="group" aria-label="Language selection">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">हिं</button>
          <button class="lang-btn" data-lang="mr">मरा</button>
        </div>
      </div>
    </div>
  </nav>
  
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  
  <footer class="site-footer">
    <div class="container">
      <p class="footer-text" data-i18n="footer_note">Built for Maharashtra's rural and small-town students. Works on slow connections.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
