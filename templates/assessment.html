{% extends "base.html" %}

{% block content %}
<section class="section assessment fade-in">
  <div class="container">
    <h1 class="page-title" data-i18n="assessment_title">Quick assessment</h1>
    <p class="page-subtitle" data-i18n="assessment_sub">Rate how much each statement sounds like you.</p>

    <div class="quiz-progress-container card mb-4">
      <div class="flex-between mb-2">
        <span>Progress</span>
        <span id="progress-text">Question 1 of 10</span>
      </div>
      <div class="quiz-progress-wrap">
        <div id="progress-bar-fill" class="quiz-progress" style="width: 0%;"></div>
      </div>
    </div>

    <div id="question-container" class="quiz-container card slide-up">
      <h2 id="question-text" class="quiz-question" aria-live="polite">Loading…</h2>

      <div id="options-container" class="likert-scale" role="radiogroup" aria-label="Rating scale"></div>

      <div class="likert-labels flex-between">
        <span data-i18n="scale_low">Not like me</span>
        <span data-i18n="scale_high">Very much like me</span>
      </div>

      <div class="quiz-actions flex-between mt-4">
        <button id="btn-prev" class="btn btn-secondary" data-i18n="back_btn" disabled>Back</button>
        <button id="btn-next" class="btn btn-primary" data-i18n="next_btn" disabled>Next</button>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/assessment.js"></script>
{% endblock %}
