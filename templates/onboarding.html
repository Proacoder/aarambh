{% extends "base.html" %}

{% block content %}
<section class="section onboarding fade-in">
  <div class="container">
    <h1 class="page-title" data-i18n="onboarding_title">Tell us about yourself</h1>
    <p class="page-subtitle" data-i18n="onboarding_sub">This takes under a minute. Nothing is shared publicly.</p>

    <div id="error-message" class="form-error card hidden" role="alert"></div>

    <form id="onboarding-form" class="card" novalidate>
      <fieldset class="form-section stagger-1 animate-on-scroll">
        <legend data-i18n="about_you">About you</legend>
        <div class="grid-2">
          <div class="form-group">
            <label for="name" class="form-label" data-i18n="field_name">Your name</label>
            <input type="text" id="name" name="name" class="form-input" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="age" class="form-label" data-i18n="field_age">Age</label>
            <input type="number" id="age" name="age" class="form-input" min="10" max="30" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="class_level" class="form-label" data-i18n="field_class">Current class / stage</label>
            <select id="class_level" name="class_level" class="form-select" required aria-required="true">
              <option value="" disabled selected>Select...</option>
              <option value="10th" data-i18n="class_10_pass">Class 10 pass</option>
              <option value="12th" data-i18n="class_12_pass">Class 12 pass</option>
              <option value="diploma" data-i18n="diploma">Diploma</option>
              <option value="ug" data-i18n="graduate">Graduate</option>
            </select>
          </div>
          <div class="form-group">
            <label for="district" class="form-label" data-i18n="field_district">District</label>
            <select id="district" name="district" class="form-select" required aria-required="true">
              <option value="" disabled selected data-i18n="select_district">Select district</option>
              {% for dist in districts %}
              <option value="{{ dist }}">{{ dist }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="taluka" class="form-label" data-i18n="field_taluka">Taluka / City (optional)</label>
            <input type="text" id="taluka" name="taluka" class="form-input">
          </div>
        </div>
      </fieldset>

      <fieldset class="form-section stagger-2 animate-on-scroll">
        <legend data-i18n="academic_info">Academic information</legend>
        <div class="grid-2">
          <div class="form-group">
            <label for="marks" class="form-label" data-i18n="field_marks">Last exam marks (%)</label>
            <input type="number" id="marks" name="marks" class="form-input" min="0" max="100" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="income" class="form-label" data-i18n="field_income">Family annual income (₹)</label>
            <input type="number" id="income" name="income" class="form-input" min="0" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="category" class="form-label" data-i18n="field_category">Category</label>
            <select id="category" name="category" class="form-select" required aria-required="true">
              <option value="" disabled selected data-i18n="select_category">Select category</option>
              <option value="General" data-i18n="gen_category">General</option>
              <option value="OBC" data-i18n="obc_category">OBC</option>
              <option value="SC" data-i18n="sc_category">SC</option>
              <option value="ST" data-i18n="st_category">ST</option>
              <option value="VJNT / NT" data-i18n="vjnt_category">VJNT / NT</option>
              <option value="SBC" data-i18n="sbc_category">SBC</option>
              <option value="EWS" data-i18n="ews_category">EWS</option>
              <option value="Minority" data-i18n="minority_category">Minority</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select id="gender" name="gender" class="form-select">
              <option value="" selected>Prefer not to say</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">
              <input type="checkbox" id="disability" name="disability"> Person with disability
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset class="form-section stagger-3 animate-on-scroll">
        <legend data-i18n="preferences">Your preferences</legend>
        <div class="form-group">
          <label class="form-label" data-i18n="field_language">Preferred language</label>
          <div class="form-radio-group" role="radiogroup">
            <label><input type="radio" name="language" value="en" checked> English</label>
            <label><input type="radio" name="language" value="hi"> हिंदी</label>
            <label><input type="radio" name="language" value="mr"> मराठी</label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="field_mobility">How far are you willing to travel to study?</label>
          <div class="form-radio-group" role="radiogroup">
            <label><input type="radio" name="mobility" value="local" required data-i18n="mobility_local"> Within my taluka</label>
            <label><input type="radio" name="mobility" value="district" data-i18n="mobility_district" checked> Within my district</label>
            <label><input type="radio" name="mobility" value="state" data-i18n="mobility_state"> Anywhere in Maharashtra</label>
          </div>
        </div>
        <div class="form-group">
          <label for="budget" class="form-label" data-i18n="field_budget">Yearly fees you can manage (₹)</label>
          <input type="number" id="budget" name="budget" class="form-input" min="0" required aria-required="true">
        </div>
      </fieldset>

      <div class="form-actions mt-4">
        <button type="submit" class="btn btn-primary btn-lg ripple" id="onboarding-submit" data-i18n="continue_btn">Continue to Assessment</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/onboarding.js"></script>
{% endblock %}
