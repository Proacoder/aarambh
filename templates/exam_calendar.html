{% extends "base.html" %}
{% block content %}
<section class="section exam-calendar fade-in">
  <div class="container">
    <div class="card text-center mb-4 slide-up">
      <div class="greeting-avatar mb-2">📅</div>
      <h1 class="page-title mb-1">Exam & Deadline Calendar</h1>
      <p class="page-subtitle">Important entrance exams and scholarship deadlines for your career path</p>
    </div>

    <div class="card mb-4">
      <div class="flex gap-2 flex-wrap" id="exam-filter-btns">
        <button class="btn btn-secondary btn-sm active" data-filter="all">All Exams</button>
        <button class="btn btn-secondary btn-sm" data-filter="10th">After 10th</button>
        <button class="btn btn-secondary btn-sm" data-filter="12th">After 12th</button>
        <button class="btn btn-secondary btn-sm" data-filter="diploma">After Diploma</button>
        <button class="btn btn-secondary btn-sm" data-filter="ug">After Graduation</button>
      </div>
    </div>

    <div id="exam-timeline"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/exam_calendar.js"></script>
{% endblock %}
