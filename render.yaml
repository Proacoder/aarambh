services:
  # ---------------------------------------------------------------------------
  # 1. Node.js Backend API (Prisma + Supabase PostgreSQL + Gemini)
  # ---------------------------------------------------------------------------
  - type: web
    name: careermitra-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Python Flask Web Application (Fullstack option on Render)
  # ---------------------------------------------------------------------------
  - type: web
    name: careermitra-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_API_URL
        fromService:
          type: web
          name: careermitra-api
          property: host
