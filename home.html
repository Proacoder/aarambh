<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Mitra | Maharashtra Career Map</title>
    <meta name="description" content="Explore career opportunities, colleges, and job markets across Maharashtra districts.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* ── Tokens ────────────────────────────────────────────── */
        :root {
            --bg:          #0A0E1A;
            --panel:       rgba(14, 20, 35, 0.95);
            --card:        rgba(20, 28, 48, 0.90);
            --primary:     #4F46E5;
            --primary-glow:rgba(79,70,229,.35);
            --accent:      #06B6D4;
            --accent-glow: rgba(6,182,212,.25);
            --green:       #10B981;
            --amber:       #F59E0B;
            --red:         #EF4444;
            --text:        #F1F5F9;
            --muted:       #94A3B8;
            --sub:         #64748B;
            --border:      rgba(255,255,255,.08);
            --radius:      14px;
        }
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'Plus Jakarta Sans',sans-serif; }

        html, body { height:100%; overflow:hidden; background:var(--bg); }

        /* ── App shell ─────────────────────────────────────────── */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ── Top navbar ────────────────────────────────────────── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 58px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
            z-index: 1000;
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .nav-logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg,#4F46E5,#06B6D4);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color:#fff;
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .nav-title {
            font-size: 17px; font-weight: 800; color: var(--text);
            letter-spacing: -.3px;
        }
        .nav-title span { color: var(--accent); }

        .nav-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            background: rgba(16,185,129,.12);
            border: 1px solid rgba(16,185,129,.25);
            border-radius: 50px;
            font-size: 12px; font-weight: 600; color: var(--green);
        }
        .pulse-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(16,185,129,.25);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100%{ box-shadow:0 0 0 3px rgba(16,185,129,.25); }
            50%    { box-shadow:0 0 0 7px rgba(16,185,129,.04); }
        }

        /* ── Main content (map + sidebar) ──────────────────────── */
        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar ────────────────────────────────────────────── */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 500;
        }

        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h2 {
            font-size: 15px; font-weight: 700; color: var(--text);
            margin-bottom: 4px;
        }
        .sidebar-header p {
            font-size: 12px; color: var(--muted);
        }

        /* Search */
        .search-box {
            position: relative; padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .search-box input {
            width: 100%; padding: 9px 14px 9px 36px;
            background: rgba(15,23,42,.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text); font-size: 13px; outline: none;
            transition: border .2s, box-shadow .2s;
        }
        .search-box input::placeholder { color: var(--sub); }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .search-box i {
            position: absolute; left: 28px; top: 50%;
            transform: translateY(-50%);
            color: var(--sub); font-size: 13px; pointer-events:none;
        }

        /* City list */
        .city-list {
            flex: 1; overflow-y: auto; padding: 8px 10px;
        }
        .city-list::-webkit-scrollbar { width: 4px; }
        .city-list::-webkit-scrollbar-track { background: transparent; }
        .city-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.1); border-radius: 4px;
        }

        .city-card {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 12px;
            border-radius: 11px;
            cursor: pointer;
            transition: background .2s;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }
        .city-card:hover { background: rgba(79,70,229,.10); border-color: rgba(79,70,229,.2); }
        .city-card.active { background: rgba(79,70,229,.18); border-color: rgba(79,70,229,.4); }

        .city-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items:center; justify-content:center;
            font-size: 14px; flex-shrink:0;
        }
        .city-info { flex: 1; min-width: 0; }
        .city-name {
            font-size: 13.5px; font-weight: 700; color: var(--text);
            margin-bottom: 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .city-sector {
            font-size: 11.5px; color: var(--muted);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .city-badge {
            font-size: 10px; font-weight: 700; padding: 2px 7px;
            border-radius: 50px; white-space:nowrap;
        }

        /* Filter chips */
        .filter-bar {
            display: flex; gap: 6px; padding: 10px 16px;
            overflow-x: auto; border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .filter-bar::-webkit-scrollbar { height: 0; }
        .chip {
            padding: 5px 12px; border-radius: 50px;
            font-size: 11.5px; font-weight: 600;
            border: 1px solid var(--border); color: var(--muted);
            cursor: pointer; white-space: nowrap;
            transition: all .2s; background: transparent;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .chip.on {
            background: linear-gradient(135deg,rgba(79,70,229,.7),rgba(6,182,212,.7));
            border-color: transparent; color: #fff;
        }

        /* ── Map ────────────────────────────────────────────────── */
        #map {
            flex: 1;
            height: 100%;
            z-index: 100;
        }

        /* Leaflet popup custom style */
        .leaflet-popup-content-wrapper {
            background: rgba(14,20,35,.97) !important;
            border: 1px solid rgba(79,70,229,.4) !important;
            border-radius: 14px !important;
            box-shadow: 0 12px 40px rgba(0,0,0,.6) !important;
            color: var(--text) !important;
            font-family: 'Plus Jakarta Sans',sans-serif !important;
        }
        .leaflet-popup-tip { background: rgba(14,20,35,.97) !important; }
        .leaflet-popup-content { margin: 16px 18px !important; }

        .popup-title {
            font-size: 15px; font-weight: 800; color: #fff;
            margin-bottom: 4px;
        }
        .popup-region {
            font-size: 11px; color: var(--accent);
            font-weight: 600; text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: 10px;
        }
        .popup-tags {
            display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;
        }
        .popup-tag {
            padding: 3px 9px; border-radius: 50px;
            font-size: 11px; font-weight: 600;
        }
        .popup-stat {
            display: flex; justify-content: space-between;
            font-size: 12px; color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 8px; margin-top: 4px;
        }
        .popup-stat strong { color: var(--text); }

        /* Info panel at bottom of map */
        .map-info-bar {
            position: absolute; bottom: 24px; right: 24px;
            z-index: 400;
            display: flex; gap: 10px;
        }
        .info-chip {
            display: flex; align-items: center; gap: 7px;
            padding: 8px 14px;
            background: rgba(14,20,35,.92);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 12px; font-weight: 600; color: var(--muted);
            backdrop-filter: blur(12px);
        }
        .info-chip span { color: var(--text); }

        /* Responsive */
        @media (max-width: 700px) {
            .sidebar { width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
            .content { flex-direction: column; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- ── Navbar ─────────────────────────────────────────────── -->
    <nav class="navbar">
        <a class="nav-brand" href="#">
            <div class="nav-logo"><i class="fa-solid fa-compass"></i></div>
            <span class="nav-title">Career <span>Mitra</span></span>
        </a>

        <div style="display:flex; align-items:center; gap:16px;">
            <span style="font-size:13px; color:var(--muted); font-weight:600;">
                <i class="fa-solid fa-map-location-dot" style="color:var(--accent); margin-right:5px;"></i>
                Maharashtra Career Map
            </span>
            <div class="nav-pill">
                <div class="pulse-dot"></div>
                Live Data
            </div>
        </div>
    </nav>

    <!-- ── Content ────────────────────────────────────────────── -->
    <div class="content">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-building-columns" style="color:var(--accent);margin-right:6px;"></i>Career Hubs</h2>
                <p>Click a city to zoom in &amp; explore careers</p>
            </div>

            <!-- Filter chips -->
            <div class="filter-bar">
                <button class="chip on"   onclick="filterCities('all', this)">All</button>
                <button class="chip"      onclick="filterCities('tech', this)"><i class="fa-solid fa-microchip"></i> Tech</button>
                <button class="chip"      onclick="filterCities('manufacturing', this)"><i class="fa-solid fa-industry"></i> Industry</button>
                <button class="chip"      onclick="filterCities('education', this)"><i class="fa-solid fa-graduation-cap"></i> Education</button>
                <button class="chip"      onclick="filterCities('finance', this)"><i class="fa-solid fa-coins"></i> Finance</button>
                <button class="chip"      onclick="filterCities('tourism', this)"><i class="fa-solid fa-landmark"></i> Tourism</button>
            </div>

            <!-- Search -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="citySearch" placeholder="Search city…" oninput="filterSearch(this.value)">
            </div>

            <!-- City cards -->
            <div class="city-list" id="cityList"></div>
        </aside>

        <!-- Map -->
        <div style="flex:1; position:relative;">
            <div id="map"></div>

            <!-- Bottom info chips -->
            <div class="map-info-bar">
                <div class="info-chip">
                    <i class="fa-solid fa-city" style="color:var(--accent);"></i>
                    <span id="cityCount">12</span> Cities
                </div>
                <div class="info-chip">
                    <i class="fa-solid fa-briefcase" style="color:var(--green);"></i>
                    <span>50+</span> Sectors
                </div>
                <div class="info-chip">
                    <i class="fa-solid fa-graduation-cap" style="color:var(--amber);"></i>
                    <span>200+</span> Colleges
                </div>
            </div>
        </div>

    </div><!-- /content -->
</div><!-- /app-shell -->


<script>
// ── City Data ─────────────────────────────────────────────────────────────
const CITIES = [

    },
    {

        sectors: ['IT', 'Automotive', 'Education', 'Defense'],

    },
    {

    {

        region: 'Marathwada Division',
        lat: 19.8762, lng: 75.3433,
        sectors: ['Automotive', 'Tourism', 'Textiles', 'Pharma'],
        color: '#8B5CF6', icon: '🏰',
        type: 'tourism',
        jobs: '60K+', colleges: 22,
        desc: 'Gateway to Ajanta-Ellora — automotive belt with Aurangabad Industrial Area.'
    },
    {
        name: 'Kolhapur',
        region: 'Kolhapur Division',
        lat: 16.7050, lng: 74.2433,
        sectors: ['Sugar', 'Foundry', 'Textiles', 'Film'],
        color: '#EC4899', icon: '⚙️',
        type: 'manufacturing',
        jobs: '44K+', colleges: 18,
        desc: 'Foundry capital — Kolhapur metal castings exported worldwide. Also "Mollywood" film hub.'
    },
    {
        name: 'Solapur',
        region: 'Pune Division',
        lat: 17.6805, lng: 75.9064,
        sectors: ['Textiles', 'Agriculture', 'Logistics', 'MSME'],
        color: '#F97316', icon: '🧵',
        type: 'manufacturing',
        jobs: '38K+', colleges: 15,
        desc: 'Textile city famous for Solapur chaddar & towels. Key APMC trading centre.'
    },
    {
        name: 'Thane',
        region: 'Konkan Division',
        lat: 19.2183, lng: 72.9781,
        sectors: ['IT', 'Real Estate', 'Chemicals', 'Retail'],
        color: '#06B6D4', icon: '🌆',
        type: 'tech',
        jobs: '1.1L+', colleges: 29,
        desc: "Mumbai's twin city — booming IT parks, MIDC chemical zones & retail corridors."
    },
    {
        name: 'Navi Mumbai',
        region: 'Konkan Division',
        lat: 19.0330, lng: 73.0297,
        sectors: ['IT', 'Port & Logistics', 'Finance', 'Healthcare'],
        color: '#4F46E5', icon: '⚓',
        type: 'tech',
        jobs: '95K+', colleges: 22,
        desc: 'Planned port city — JNPT handles 55% of India\'s container traffic. Growing IT hub.'
    },
    {
        name: 'Amravati',
        region: 'Vidarbha Division',
        lat: 20.9374, lng: 77.7796,
        sectors: ['Agriculture', 'Education', 'Textiles', 'Storage'],
        color: '#10B981', icon: '🌾',
        type: 'education',
        jobs: '28K+', colleges: 19,
        desc: 'Cotton & orange belt of Vidarbha with large university campus & agri-processing units.'
    },
    {
        name: 'Latur',
        region: 'Marathwada Division',
        lat: 18.4088, lng: 76.5604,
        sectors: ['Agriculture', 'Education', 'Food Processing', 'Banking'],
        color: '#F59E0B', icon: '📚',
        type: 'education',
        jobs: '22K+', colleges: 14,
        desc: 'Latur Pattern — famous for intense IIT/NEET coaching culture. Tur dal & sugar belt.'
    },
    {
        name: 'Satara',
        region: 'Pune Division',
        lat: 17.6805, lng: 74.0183,
        sectors: ['Tourism', 'Sugar', 'Defense', 'Agriculture'],
        color: '#EC4899', icon: '🏔️',
        type: 'tourism',
        jobs: '18K+', colleges: 11,
        desc: 'Panchgani & Mahabaleshwar tourism hub. Kaas Plateau UNESCO biodiversity hotspot.'
    },
];

// Category → type mapping
const TYPE_MAP = { tech:'tech', finance:'finance', manufacturing:'manufacturing', education:'education', tourism:'tourism' };

let activeFilter = 'all';
let activeCard = null;
let markers = {};
let map;

// ── Leaflet map init ────────────────────────────────────────────────────────
function initMap() {
    map = L.map('map', {
        center: [19.5, 76.0],
        zoom: 7,
        zoomControl: false,
        attributionControl: true
    });

    // Dark CartoDB tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a> | &copy; <a href="https://www.openstreetmap.org/">OSM</a>',
        subdomains: 'abcd', maxZoom: 18
    }).addTo(map);

    // Custom zoom control position
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Load Maharashtra GeoJSON boundary
    fetch('https://raw.githubusercontent.com/datameet/maps/master/States/maharashtra.geojson')
        .then(r => r.json())
        .then(data => {
            L.geoJSON(data, {
                style: {
                    color:       '#4F46E5',
                    weight:      2,
                    opacity:     0.8,
                    fillColor:   '#4F46E5',
                    fillOpacity: 0.06
                }
            }).addTo(map);
        })
        .catch(() => {
            // Fallback: draw rough Maharashtra polygon if GeoJSON fetch fails
            const fallback = [
                [22.0, 72.6],[21.0, 73.0],[20.4, 73.5],[19.8, 73.0],[19.2, 72.8],
                [18.9, 72.8],[17.9, 73.4],[16.7, 73.5],[16.0, 73.8],[15.7, 74.1],
                [15.5, 75.0],[16.2, 76.0],[17.0, 77.0],[18.0, 77.8],[18.6, 76.4],
                [19.0, 76.8],[19.5, 77.8],[20.2, 78.5],[21.3, 79.5],[22.0, 79.0],
                [22.5, 78.0],[22.0, 76.0],[22.0, 72.6]
            ];
            L.polygon(fallback, {
                color:'#4F46E5', weight:2, opacity:.8,
                fillColor:'#4F46E5', fillOpacity:.05
            }).addTo(map);
        });

    // Place city markers
    CITIES.forEach(city => addMarker(city));

    // Fit bounds to Maharashtra
    map.fitBounds([[15.5, 72.6], [22.1, 80.5]]);
}

// ── City marker ──────────────────────────────────────────────────────────────
function addMarker(city) {
    const markerHtml = `
        <div style="
            width:38px; height:38px; border-radius:50%;
            background:${city.color}22;
            border:2px solid ${city.color};
            display:flex; align-items:center; justify-content:center;
            font-size:17px;
            box-shadow:0 0 0 5px ${city.color}20, 0 4px 16px rgba(0,0,0,.5);
            transition:transform .2s;
        ">${city.icon}</div>`;

    const icon = L.divIcon({ html: markerHtml, className:'', iconSize:[38,38], iconAnchor:[19,19] });

    const marker = L.marker([city.lat, city.lng], { icon })
        .addTo(map)
        .bindPopup(buildPopup(city), { maxWidth: 280, className:'cm-popup' });

    marker.on('click', () => activateCard(city.name));
    markers[city.name] = marker;
}

// ── Popup HTML ───────────────────────────────────────────────────────────────
function buildPopup(city) {
    const tags = city.sectors.map(s =>
        `<span class="popup-tag" style="background:${city.color}22;color:${city.color};border:1px solid ${city.color}55;">${s}</span>`
    ).join('');
    return `
        <div class="popup-title">${city.icon} ${city.name}</div>
        <div class="popup-region">${city.region}</div>
        <p style="font-size:12px;color:#94A3B8;margin-bottom:9px;line-height:1.5;">${city.desc}</p>
        <div class="popup-tags">${tags}</div>
        <div class="popup-stat">
            <div><i class="fa-solid fa-briefcase" style="color:#10B981;margin-right:4px;"></i>Jobs: <strong>${city.jobs}</strong></div>
            <div><i class="fa-solid fa-university" style="color:#F59E0B;margin-right:4px;"></i>Colleges: <strong>${city.colleges}</strong></div>
        </div>`;
}

// ── Sidebar card list ────────────────────────────────────────────────────────
function buildSidebar(list) {
    const container = document.getElementById('cityList');
    container.innerHTML = '';

    if (!list.length) {
        container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;">No cities found.</div>`;
        return;
    }

    list.forEach(city => {
        const card = document.createElement('div');
        card.className = 'city-card';
        card.id = `card-${city.name}`;
        card.innerHTML = `
            <div class="city-icon" style="background:${city.color}20;color:${city.color};font-size:18px;">${city.icon}</div>
            <div class="city-info">
                <div class="city-name">${city.name}</div>
                <div class="city-sector">${city.sectors.slice(0,3).join(' · ')}</div>
            </div>
            <span class="city-badge" style="background:${city.color}20;color:${city.color};border:1px solid ${city.color}40;">
                ${city.jobs}
            </span>`;
        card.onclick = () => {
            activateCard(city.name);
            map.flyTo([city.lat, city.lng], 11, { duration: 1.2 });
            markers[city.name].openPopup();
        };
        container.appendChild(card);
    });

    document.getElementById('cityCount').textContent = list.length;
}

function activateCard(name) {
    if (activeCard) document.getElementById(`card-${activeCard}`)?.classList.remove('active');
    activeCard = name;
    const el = document.getElementById(`card-${name}`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
}

// ── Filtering ────────────────────────────────────────────────────────────────
function filterCities(type, btn) {
    activeFilter = type;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    btn.classList.add('on');
    applyFilters();
}

function filterSearch(val) { applyFilters(val); }

function applyFilters(search = document.getElementById('citySearch').value) {
    let list = CITIES;
    if (activeFilter !== 'all') list = list.filter(c => c.type === activeFilter);
    if (search) list = list.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));
    buildSidebar(list);

    // Toggle marker visibility
    CITIES.forEach(city => {
        const visible = list.find(c => c.name === city.name);
        if (markers[city.name]) {
            if (visible) {
                markers[city.name].addTo(map);
            } else {
                markers[city.name].removeFrom(map);
            }
        }
    });
}

// ── Boot ─────────────────────────────────────────────────────────────────────
initMap();
buildSidebar(CITIES);
</script>
