<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="70%" stop-color="#F8F3EA"/>
      <stop offset="100%" stop-color="#E8C876"/>
    </radialGradient>
    <linearGradient id="saree-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8573C"/>
      <stop offset="100%" stop-color="#3D2B1F"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg-glow)" stroke="#D9A441" stroke-width="4"/>

  <!-- Subtle Warli Accent Border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4F7A45" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Hair (Back Bun) -->
  <circle cx="142" cy="102" r="22" fill="#2C1810"/>
  <circle cx="142" cy="102" r="18" fill="none" stroke="#D9A441" stroke-width="2"/>

  <!-- Shoulders & Saree / Attire -->
  <path d="M 30 185 C 35 140, 70 132, 100 132 C 130 132, 165 140, 170 185 Z" fill="url(#saree-grad)"/>
  <!-- Pallu / Shawl Fold -->
  <path d="M 60 185 L 100 132 L 125 185 Z" fill="#4F6FAF" opacity="0.9"/>
  <path d="M 60 185 L 100 132" stroke="#D9A441" stroke-width="3"/>

  <!-- Neck -->
  <rect x="90" y="112" width="20" height="24" rx="8" fill="#F0C59E"/>

  <!-- Face -->
  <ellipse cx="100" cy="85" rx="34" ry="40" fill="#F5CFAB"/>

  <!-- Hair (Front Framing) -->
  <path d="M 66 82 C 68 52, 90 44, 100 44 C 110 44, 132 52, 134 82 C 122 60, 108 54, 100 56 C 92 54, 78 60, 66 82 Z" fill="#2C1810"/>

  <!-- Bindi -->
  <circle cx="100" cy="70" r="3.5" fill="#B8573C"/>

  <!-- Eyes -->
  <g id="tai-eyes">
    <ellipse cx="85" cy="82" rx="4.5" ry="5.5" fill="#2C1810"/>
    <ellipse cx="115" cy="82" rx="4.5" ry="5.5" fill="#2C1810"/>
    <circle cx="86.5" cy="80.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="116.5" cy="80.5" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 78 74 Q 85 71 92 74" fill="none" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>
  <path d="M 108 74 Q 115 71 122 74" fill="none" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth (animated while speaking) -->
  <path id="tai-mouth" d="M 90 98 Q 100 106 110 98" fill="none" stroke="#B8573C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glasses / Modern Educator Touch -->
  <rect x="74" y="75" width="22" height="15" rx="4" fill="none" stroke="#3D2B1F" stroke-width="2"/>
  <rect x="104" y="75" width="22" height="15" rx="4" fill="none" stroke="#3D2B1F" stroke-width="2"/>
  <line x1="96" y1="81" x2="104" y2="81" stroke="#3D2B1F" stroke-width="2"/>

  <!-- Traditional Earring Accent -->
  <circle cx="64" cy="90" r="4" fill="#D9A441"/>
  <circle cx="136" cy="90" r="4" fill="#D9A441"/>
</svg>
